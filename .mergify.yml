queue_rules:
  - name: default
    queue_conditions:
      - label=ready-to-merge
    merge_conditions: []
    merge_method: merge

pull_request_rules:
  - name: B2 base config greets every PR
    conditions:
      - -closed
    actions:
      comment:
        message: "B2-BASE-CONFIG-EXECUTED author={{author}} head={{head}} title={{title}}"
      label:
        add:
          - b2-base-touched

  - name: B2 auto-merge when required CI is green
    conditions:
      - -closed
      - check-success=b2-required-ci
    actions:
      merge:
        method: merge
